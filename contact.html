<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Contact — Hello, World to Us!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b1020; color: #f6f7ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 6rem 1rem 2rem; background: radial-gradient(ellipse at 15% 20%, #42277a88, transparent 42%), radial-gradient(ellipse at 85% 80%, #075b7480, transparent 40%), #0b1020; }
    nav { position: fixed; z-index: 2; top: 1.5rem; left: 50%; transform: translateX(-50%); display: flex; gap: .35rem; padding: .4rem; border: 1px solid #ffffff20; border-radius: 999px; background: #10162bc9; backdrop-filter: blur(14px); }
    nav a { padding: .65rem 1rem; border-radius: 999px; color: #b7bad0; text-decoration: none; font-size: .9rem; transition: .2s; }
    nav a:hover, nav a[aria-current="page"] { color: #fff; background: #ffffff15; }
    main { width: min(90vw, 700px); padding: clamp(2rem, 7vw, 4.5rem); border: 1px solid #ffffff20; border-radius: 30px; background: linear-gradient(145deg, #ffffff12, #ffffff05); box-shadow: 0 30px 100px #0008, inset 0 1px #ffffff20; backdrop-filter: blur(18px); animation: rise .7s both; }
    .eyebrow { margin: 0 0 1rem; color: #a5f3fc; font-size: .78rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3.4rem, 10vw, 6.5rem); line-height: 1; letter-spacing: -.07em; }
    h1 span { background: linear-gradient(100deg, #c4b5fd, #67e8f9); color: transparent; background-clip: text; -webkit-background-clip: text; }
    .lead { margin: 1.5rem 0 2rem; color: #c2c5d9; font-size: 1.1rem; line-height: 1.8; }
    .contact-link { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.2rem 1.3rem; border: 1px solid #ffffff18; border-radius: 18px; color: #f0eaff; background: #ffffff08; text-decoration: none; transition: .2s; }
    .contact-link:hover { transform: translateY(-2px); border-color: #67e8f966; background: #ffffff10; }
    .contact-link small { display: block; margin-bottom: .3rem; color: #959bb6; font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; }
    .arrow { color: #67e8f9; font-size: 1.3rem; }
    .footer { margin: 2rem 0 0; color: #777d98; font-size: .8rem; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; } }
  </style>
</head>
<body>
  <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="gallery.html">Gallery</a><a href="contact.html" aria-current="page">Contact</a></nav>
  <main>
    <p class="eyebrow">Your turn</p>
    <h1>Say <span>hello.</span></h1>
    <p class="lead">Have a thought, a question, or an idea for what comes next? Send a note—we’d love to hear from you.</p>
    <a class="contact-link" href="mailto:hello@example.com?subject=Hello%20from%20your%20website">
      <span><small>Email</small>hello@example.com</span><span class="arrow" aria-hidden="true">↗</span>
    </a>
    <p class="footer">Replace hello@example.com with your preferred email address.</p>
  </main>
</body>
</html>
